# ─────────────────────────────────────────────────────────────
#  Judge0 CE Configuration for AdaptLearn
# ─────────────────────────────────────────────────────────────

# PostgreSQL — Judge0 stores submission records here
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=adaptlearn_pg_2024
POSTGRES_HOST=judge0-db

# Redis — Judge0 job queue
REDIS_HOST=judge0-redis
REDIS_PASSWORD=adaptlearn_redis_2024

# Auth token — backend uses this to talk to Judge0
# Must match JUDGE0_TOKEN in backend/.env
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=adaptlearn_sandbox_token_2024

# Execution limits (applied per submission globally)
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MEMORY_LIMIT=131072
STACK_LIMIT=65536
MAX_PROCESSES_AND_OR_THREADS=30
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=1024

# Workers
RAILS_ENV=production
SECRET_KEY_BASE=adaptlearn_judge0_secret_base_key_32chars_min
